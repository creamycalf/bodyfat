<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知衡 · 个人健康管理</title><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/safety.css"><link rel="stylesheet" href="/health-pages.css"><link rel="stylesheet" href="/nutrition-report.css"></head>
<body><div class="app-shell">
<aside class="sidebar"><a class="brand" href="#chat" data-view="chat"><span class="brand-mark">知</span><span>知衡<small>把对话，变成持续的照顾。</small></span></a><nav aria-label="主导航"><button data-view="chat" class="active"><i>◌</i><span>对话</span></button><button data-view="dashboard"><i>◫</i><span>看板</span></button><button data-view="plan"><i>▤</i><span>计划</span></button><button data-view="archive"><i>◎</i><span>档案</span></button></nav><p class="sidebar-note"><span></span>资料与计划保存在本机<br>每次变化都保留依据</p></aside>
<div class="workspace"><header><div><span id="breadcrumb">对话</span><span id="connection" role="status">连接中…</span></div><button data-view="mine" class="settings" aria-label="设置">⚙ 设置</button></header><main>
<section id="chat" class="view"><div class="heading"><div><h1>知衡</h1><p class="intro">饮食 · 运动 · 健康，接着你的情况聊</p></div><div class="chat-heading-actions"><button id="open-history" type="button" aria-haspopup="dialog">历史对话</button><button id="export-chat" type="button">导出本对话</button><button id="new-chat" type="button">＋ 新对话</button></div></div><div id="assessment"></div><div id="messages" aria-live="polite"></div><div id="intake"></div>
<form id="composer" class="composer"><div id="reply-photo" class="reply-photo" hidden></div><label class="sr" for="message">告诉我你的情况或问题</label><textarea id="message" rows="2" placeholder="问饮食、运动，或发食物 / 检查报告照片…"></textarea><div id="voice-status" class="muted" role="status"></div><div class="actions composer-tools"><button id="photo" type="button">＋ 图片 / 报告</button><input id="photo-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden><button id="voice" type="button">🎙 语音</button><button id="voice-cancel" type="button" hidden>取消录音</button><button class="primary" id="send" type="submit">发送</button></div><details id="photo-options" hidden><summary>图片类型 · 自动识别</summary><select id="photo-category" aria-label="图片类型"><option value="food">饮食照片</option><option value="report">检查报告</option><option value="general">一般图片</option></select></details></form><dialog id="history-dialog" aria-labelledby="history-title"><div class="history-heading"><h2 id="history-title">历史对话</h2><button id="close-history" type="button" aria-label="关闭历史对话">关闭 ×</button></div><div class="history-panel"><label class="sr" for="history-search">搜索历史对话</label><input id="history-search" placeholder="搜索对话"><div id="history"></div></div></dialog></section>
<section id="dashboard" class="view" hidden><div class="heading"><div><small>真实记录与每天的变化</small><h1>健康看板</h1></div><span id="today"></span></div><div id="dashboard-content"></div></section>
<section id="archive" class="view" hidden><div class="heading"><div><small>长期资料与每日历史</small><h1>健康档案</h1></div></div><div id="archive-content"></div></section>
<section id="mine" class="view" hidden><div class="heading"><div><small>由你掌握</small><h1>设置</h1></div></div><div class="card"><h2>记录方式</h2><label><input id="confirm-each" type="checkbox"> 每次确认后再保存对话提取的信息</label><p class="muted">默认自动整理明确的本人陈述；不确定的内容先核实。</p></div><div class="card"><h2>数据与连接</h2><p id="model-status" class="muted"></p><div class="actions"><button id="export">导出数据</button><button id="backup">下载完整备份</button><button id="restore">恢复备份</button><input id="restore-file" type="file" accept=".zip" hidden></div><p class="muted">备份包含档案、计划、反馈和原图。</p><button id="reset" class="danger">清空应用数据</button></div><div class="card"><h2>使用说明</h2><p>用于日常健康管理，不替代医疗诊断。文字和图片可能发送给已配置的模型服务。</p></div></section>
</main></div></div><div id="toast" role="status" hidden></div><script type="module" src="/app.js"></script></body></html>
